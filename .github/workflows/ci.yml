name: Canadian Syncope Risk Score CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_ci.csv
        python -c "import os; assert os.path.exists('out_ci.csv') and os.path.getsize('out_ci.csv') > 0"
        rm -f out_ci.csv
