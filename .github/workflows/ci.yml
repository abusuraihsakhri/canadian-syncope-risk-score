name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q canadian_syncope.py csrs_engine.py cli.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI smoke test
        run: |
          python cli.py evaluate --vasovagal-predisposition --json > /tmp/csrs.json
          python -c "import json; d=json.load(open('/tmp/csrs.json')); assert d['score'] == -1 and d['risk_tier'] == 'Low'"
          python cli.py batch -i sample.csv -o /tmp/csrs-results.csv
          test -s /tmp/csrs-results.csv

  web:
    name: Browser calculator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JavaScript syntax
        run: |
          node --check csrs.mjs
          node --check app.mjs
          node --check tests/test_web.mjs
      - name: Calculator tests
        run: node tests/test_web.mjs
      - name: Static asset checks
        run: |
          test -s index.html
          test -s styles.css
          grep -q '>Analyze<' index.html
          ! grep -R -nEi '(api[_-]?key|password|secret|token).{0,20}(=|:).{0,10}[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
