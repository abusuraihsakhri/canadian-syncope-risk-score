name: Publish v1.0.0

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 2dd4211f0df2af5127c406de29b50bd1edb50f57 \
            --title "v1.0.0" \
            --notes "Corrected the CSRS to the published nine-component weights and thresholds, removed unsupported heuristic extensions, added a tested dependency-free browser calculator and GitHub Pages deployment, and updated CLI, tests, privacy notes, and evidence documentation."
